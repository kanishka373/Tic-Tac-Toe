<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=pacifico:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="card">
    <div class="top">
  <h1>Tic Tac Toe</h1>
  <button id="mute">🔊</button>
</div>

    <select id="mode">
      <option value="2p">2 Players</option>
      <option value="easy">vs Computer (Easy)</option>
      <option value="hard">vs Computer (Hard)</option>
    </select>

    <div class="scores">
      <div class="x">X <b id="sX">0</b></div>
      <div>Draw <b id="sD">0</b></div>
      <div class="o">O <b id="sO">0</b></div>
    </div>

    <p id="status"></p>
    <div class="board" id="board"></div>
    <button id="restart">Restart</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
